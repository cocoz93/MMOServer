<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  @font-face{font-family:'Pretendard';
    src:url('fonts/PretendardVariable.woff2') format('woff2');
    font-weight:100 900;font-style:normal;font-display:block}
  :root{
    --bg:#eef1f5; --card:#ffffff; --ink:#1f2330; --muted:#7c8597;
    --red:#d7263d; --blue:#3a78b8; --blue-ink:#2b6aa8; --slate:#566072;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:1200px;height:642px;overflow:hidden;background:var(--bg);
    font-family:'Pretendard',"Malgun Gothic","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;text-rendering:optimizeLegibility}
  .card{position:absolute;top:24px;left:24px;width:1152px;height:594px;background:var(--card);
    border:1px solid #eef0f3;border-radius:30px;box-shadow:0 1px 3px rgba(30,40,70,.05),0 14px 44px rgba(30,40,70,.075);
    padding:34px 56px 0}

  .title{font-size:37px;font-weight:800;color:var(--ink);letter-spacing:-.8px;line-height:1.08}
  .title .b{color:var(--blue-ink)}
  .uline{width:66px;height:6px;border-radius:3px;background:var(--blue);margin-top:14px}
  .sub{margin-top:13px;font-size:19px;font-weight:500;color:var(--muted);letter-spacing:-.2px}
  .sub b{color:#3a4254;font-weight:700}

  .stage{margin-top:16px;display:grid;grid-template-columns:1fr 110px 1fr;align-items:start;height:262px}
  .side{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}

  .chip{font-size:16px;font-weight:800;padding:6px 17px;border-radius:999px;letter-spacing:-.2px}
  .chip.off{background:#eceff4;color:#6b7484}
  .chip.on{background:var(--blue);color:#fff}

  .art{height:136px;display:flex;align-items:center;justify-content:center;margin-top:10px}

  /* 직렬화 버퍼 카드 */
  .buf{width:82px;height:104px;border-radius:12px;background:var(--blue);position:relative;
    box-shadow:0 6px 16px rgba(30,40,70,.10)}
  .buf i{position:absolute;left:13px;right:13px;height:9px;border-radius:5px;background:rgba(255,255,255,.55)}
  .buf i:nth-child(1){top:30px} .buf i:nth-child(2){top:48px} .buf i:nth-child(3){top:66px}
  .stack{position:relative;width:146px;height:116px}
  .stack .buf{position:absolute;top:0;left:0}
  .stack .buf:nth-child(1){transform:translate(0,12px);opacity:.40}
  .stack .buf:nth-child(2){transform:translate(16px,9px);opacity:.55}
  .stack .buf:nth-child(3){transform:translate(32px,6px);opacity:.71}
  .stack .buf:nth-child(4){transform:translate(48px,3px);opacity:.86}
  .stack .buf:nth-child(5){transform:translate(64px,0)}

  .shared{display:flex;align-items:center}
  .peers{display:flex;flex-direction:column;gap:10px}
  .peers span{display:block;width:26px;height:26px;border-radius:50%;background:#fff;border:2.5px solid #c3cedb}

  .num{margin-top:12px;font-size:54px;font-weight:800;letter-spacing:-2px;line-height:1}
  .num.g{color:#8892a3} .num.b{color:var(--blue-ink)}
  .cap{margin-top:8px;font-size:17.5px;font-weight:700;color:#5b6474;letter-spacing:-.3px}

  .mid{height:100%;display:flex;align-items:center;justify-content:center;padding-bottom:40px}
  .mid svg{width:74px;height:34px}

  .res{margin-top:22px;height:98px;border-radius:20px;background:#f2f6fb;border:1.5px solid #d9e6f3;
    display:flex;align-items:center;padding:0 34px;gap:30px}
  .res .pct{font-size:58px;font-weight:800;color:var(--blue-ink);letter-spacing:-2.5px;line-height:1}
  .res .txt{font-size:21px;font-weight:800;color:var(--ink);letter-spacing:-.4px;line-height:1.4}
  .res .txt span{display:block;margin-top:3px;font-size:17.5px;font-weight:700;color:#6a7488}

  .foot{position:absolute;left:56px;right:56px;bottom:16px;padding-top:12px;border-top:1px solid #eef0f3;
    font-size:15.5px;color:#9aa3b2;font-weight:500;letter-spacing:-.2px}
  .foot b{color:#6b7484;font-weight:700}
</style>
</head>
<body>
  <div class="card">
    <div class="title">P1 · 아웃바운드 — 같은 내용은 <span class="b">한 번만</span> 만든다</div>
    <div class="uline"></div>
    <div class="sub">N명에게 <b>똑같은 바이트</b>를 보내면서 · 그 바이트를 N번 새로 만들고 있었다</div>

    <div class="stage">
      <div class="side">
        <span class="chip off">이전</span>
        <div class="art">
          <div class="stack">
            <div class="buf"><i></i><i></i><i></i></div>
            <div class="buf"><i></i><i></i><i></i></div>
            <div class="buf"><i></i><i></i><i></i></div>
            <div class="buf"><i></i><i></i><i></i></div>
            <div class="buf"><i></i><i></i><i></i></div>
          </div>
        </div>
        <div class="num g">N회</div>
        <div class="cap">수신자마다 새로 만든다</div>
      </div>

      <div class="mid">
        <svg viewBox="0 0 74 34">
          <path d="M0,13 H46 V3 L74,17 L46,31 V21 H0 Z" fill="#3a78b8"></path>
        </svg>
      </div>

      <div class="side">
        <span class="chip on">P1</span>
        <div class="art">
          <div class="shared">
            <div class="buf"><i></i><i></i><i></i></div>
            <svg width="92" height="116" viewBox="0 0 92 116">
              <g stroke="#3a78b8" stroke-width="2.6" fill="none" opacity=".85">
                <path d="M2,58 C40,58 48,14 88,14"></path>
                <path d="M2,58 C40,58 48,44 88,44"></path>
                <path d="M2,58 C40,58 48,72 88,72"></path>
                <path d="M2,58 C40,58 48,102 88,102"></path>
              </g>
            </svg>
            <div class="peers"><span></span><span></span><span></span><span></span></div>
          </div>
        </div>
        <div class="num b">1회</div>
        <div class="cap">하나를 만들어 N명이 나눠 본다</div>
      </div>
    </div>

    <div class="res">
      <div class="pct">−28%</div>
      <div class="txt">섹터 JOIN/LEAVE 비용 19.5 → 14.0 ms/tick
        <span>gameloop 0.86 → 0.74 core</span>
      </div>
    </div>

    <div class="foot"><b>보내는 횟수는 그대로</b> — 줄인 건 만드는 비용뿐 | 동접 4000 · 중앙값(3rep)</div>
  </div>
</body>
</html>
