<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  @font-face{font-family:'Pretendard';
    src:url('fonts/PretendardVariable.woff2') format('woff2');
    font-weight:100 900;font-style:normal;font-display:block}
  :root{
    --bg:#eef1f5; --card:#ffffff; --ink:#1f2330; --muted:#7c8597;
    --red:#d7263d; --deep:#b3122a; --blue:#3a78b8; --slate:#566072;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:1200px;height:642px;overflow:hidden;background:var(--bg);
    font-family:'Pretendard',"Malgun Gothic","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;text-rendering:optimizeLegibility}
  .card{position:absolute;top:24px;left:24px;width:1152px;height:594px;background:var(--card);
    border:1px solid #eef0f3;border-radius:30px;box-shadow:0 1px 3px rgba(30,40,70,.05),0 14px 44px rgba(30,40,70,.075);
    padding:34px 56px 0}

  .title{font-size:37px;font-weight:800;color:var(--ink);letter-spacing:-.8px;line-height:1.08}
  .title .r{color:var(--red)}
  .uline{width:66px;height:6px;border-radius:3px;background:var(--red);margin-top:14px}
  .sub{margin-top:13px;font-size:19px;font-weight:500;color:var(--muted);letter-spacing:-.2px}
  .sub b{color:#3a4254;font-weight:700}

  .stage{margin-top:16px;display:grid;grid-template-columns:1fr 110px 1fr;align-items:start;height:262px}
  .side{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}

  .chip{font-size:16px;font-weight:800;padding:6px 17px;border-radius:999px;letter-spacing:-.2px}
  .chip.off{background:#eceff4;color:#6b7484}
  .chip.on{background:var(--red);color:#fff}

  .art{height:136px;display:flex;align-items:center;justify-content:center;margin-top:10px;position:relative}

  /* 패킷 = 봉투 */
  .env{width:88px;height:112px;border-radius:12px;background:#fff;border:2.5px solid var(--red);
    overflow:hidden;box-shadow:0 6px 16px rgba(30,40,70,.10)}
  .env .hd{height:15px;background:var(--red)}
  .env .bd{padding:9px 10px;display:flex;flex-direction:column;gap:7px}
  .env .it{height:13px;border-radius:4px}

  .stack{position:relative;width:150px;height:116px}
  .stack .env{position:absolute;top:0;left:0}
  .stack .env:nth-child(1){transform:translate(0,12px);opacity:.42}
  .stack .env:nth-child(2){transform:translate(20px,9px);opacity:.58}
  .stack .env:nth-child(3){transform:translate(40px,5px);opacity:.76}
  .stack .env:nth-child(4){transform:translate(60px,0)}

  .tagB{position:absolute;font-size:13.5px;font-weight:800;letter-spacing:-.2px;color:#8a93a5}
  .tagB.big{right:-4px;bottom:2px}
  .tagB.small{right:26px;top:34px;color:var(--red)}

  .num{margin-top:12px;font-size:54px;font-weight:800;letter-spacing:-2px;line-height:1}
  .num.g{color:#8892a3} .num.r{color:var(--red)}
  .cap{margin-top:8px;font-size:17.5px;font-weight:700;color:#5b6474;letter-spacing:-.3px}

  .mid{height:100%;display:flex;align-items:center;justify-content:center;padding-bottom:40px}
  .mid svg{width:74px;height:34px}

  .res{margin-top:22px;height:98px;border-radius:20px;background:#fdf2f4;border:1.5px solid #f4d3da;
    display:flex;align-items:center;padding:0 34px;gap:30px}
  .res .pct{font-size:58px;font-weight:800;color:var(--red);letter-spacing:-2.5px;line-height:1}
  .res .txt{font-size:21px;font-weight:800;color:var(--ink);letter-spacing:-.4px;line-height:1.4}
  .res .txt span{display:block;margin-top:3px;font-size:17.5px;font-weight:700;color:#6a7488}

  .foot{position:absolute;left:56px;right:56px;bottom:16px;padding-top:12px;border-top:1px solid #eef0f3;
    font-size:15.5px;color:#9aa3b2;font-weight:500;letter-spacing:-.2px}
  .foot b{color:#6b7484;font-weight:700}
</style>
</head>
<body>
  <div class="card">
    <div class="title">P2 · 인바운드 — 여러 개를 <span class="r">한 봉투에</span> 담는다</div>
    <div class="uline"></div>
    <div class="sub">받는 사람은 <b>나 하나뿐</b> · 그런데 상대 한 명마다 봉투(패킷)를 새로 뜯고 있었다</div>

    <div class="stage">
      <div class="side">
        <span class="chip off">이전</span>
        <div class="art">
          <div class="stack">
            <div class="env"><div class="hd"></div><div class="bd"><div class="it" style="background:#c4cbd6"></div></div></div>
            <div class="env"><div class="hd"></div><div class="bd"><div class="it" style="background:#94a3b8"></div></div></div>
            <div class="env"><div class="hd"></div><div class="bd"><div class="it" style="background:#566072"></div></div></div>
            <div class="env"><div class="hd"></div><div class="bd"><div class="it" style="background:#d7263d"></div></div></div>
          </div>
        </div>
        <div class="num g">N봉투</div>
        <div class="cap">상대마다 1460B 봉투를 새로 뜯는다</div>
      </div>

      <div class="mid">
        <svg viewBox="0 0 74 34">
          <path d="M0,13 H46 V3 L74,17 L46,31 V21 H0 Z" fill="#d7263d"></path>
        </svg>
      </div>

      <div class="side">
        <span class="chip on">P2</span>
        <div class="art">
          <div class="env" style="width:104px;height:126px">
            <div class="hd"></div>
            <div class="bd">
              <div class="it" style="background:#566072"></div>
              <div class="it" style="background:#d7263d"></div>
              <div class="it" style="background:#94a3b8"></div>
              <div class="it" style="background:#c4cbd6"></div>
            </div>
          </div>
        </div>
        <div class="num r">1봉투</div>
        <div class="cap">여러 상대를 한 봉투에 담는다</div>
      </div>
    </div>

    <div class="res">
      <div class="pct">−52%</div>
      <div class="txt">섹터 JOIN/LEAVE 비용 12.7 → 6.2 ms/tick
        <span>gameloop 0.67 → 0.49 core · P1보다 더 크게 접힘</span>
      </div>
    </div>

    <div class="foot">내용(25B)보다 <b>봉투 값이 더 비쌌다</b> — 봉투를 N→1로 줄여 그 고정비를 걷어냄 | 동접 4000 · 중앙값(3rep)</div>
  </div>
</body>
</html>
