<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  @font-face{font-family:'Pretendard';
    src:url('fonts/PretendardVariable.woff2') format('woff2');
    font-weight:100 900;font-style:normal;font-display:block}
  :root{
    --bg:#eef1f5; --card:#ffffff; --ink:#1f2330; --muted:#7c8597;
    --red:#d7263d; --deep:#b3122a; --blue:#3a78b8; --blue-ink:#2b6aa8; --slate:#566072;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:1200px;height:640px;overflow:hidden;background:var(--bg);
    font-family:'Pretendard',"Malgun Gothic","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;text-rendering:optimizeLegibility}
  .card{position:absolute;top:24px;left:24px;width:1152px;height:592px;background:var(--card);
    border:1px solid #eef0f3;border-radius:30px;box-shadow:0 1px 3px rgba(30,40,70,.05),0 14px 44px rgba(30,40,70,.075);
    padding:34px 56px 0}

  .title{font-size:37px;font-weight:800;color:var(--ink);letter-spacing:-.8px;line-height:1.08}
  .title .r{color:var(--red)}
  .title .b{color:var(--blue-ink)}
  .uline{width:66px;height:6px;border-radius:3px;background:var(--red);margin-top:14px}
  .sub{margin-top:13px;font-size:19px;font-weight:500;color:var(--muted);letter-spacing:-.2px}
  .sub b{color:#3a4254;font-weight:700}

  .panels{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;column-gap:26px}
  .panel{border-radius:22px;border:1.5px solid #e7ebf1;padding:16px 18px 14px;
    display:flex;flex-direction:column;align-items:center}
  .panel.out{background:#f2f6fb}
  .panel.in{background:#fbeff2}

  .ph{display:flex;align-items:center;gap:11px;height:32px}
  .tag{font-size:16px;font-weight:800;padding:5px 15px;border-radius:999px}
  .panel.out .tag{background:#dfebf8;color:var(--blue-ink)}
  .panel.in  .tag{background:#fadde3;color:var(--red)}
  .dir{font-size:17px;font-weight:700;color:#6a7488;letter-spacing:-.2px}
  .dir b{color:var(--ink);font-weight:800}

  .viz{width:100%;height:262px;margin-top:2px}

  .say{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.5px;text-align:center;margin-top:2px}
  .panel.out .say em{color:var(--blue-ink);font-style:normal}
  .panel.in  .say em{color:var(--red);font-style:normal}
  .say .q{display:block;margin-top:6px;font-size:15.5px;font-weight:600;color:#8a93a5;letter-spacing:-.2px}

  .foot{position:absolute;left:56px;right:56px;bottom:16px;padding-top:12px;border-top:1px solid #eef0f3;
    font-size:15.5px;color:#9aa3b2;font-weight:500;letter-spacing:-.2px}
  .foot b{color:#6b7484;font-weight:700}
</style>
</head>
<body>
  <div class="card">
    <div class="title">한 발 움직이면 — 패킷이 <span class="b">나가고</span> <span class="r">들어온다</span></div>
    <div class="uline"></div>
    <div class="sub">mover가 섹터 경계를 넘는 순간 · <b>나가는 건 전부 같은 내용, 들어오는 건 전부 다른 내용</b></div>

    <div class="panels">

      <!-- OUTBOUND : 나에서 밖으로 퍼진다 -->
      <div class="panel out">
        <div class="ph"><span class="tag">아웃바운드</span><span class="dir"><b>나</b> → 상대 N명</span></div>
        <svg class="viz" viewBox="0 25 460 240">
          <defs>
            <marker id="ahB" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13"
                    refX="11" refY="6.5" orient="auto">
              <path d="M0,0 L13,6.5 L0,13 Z" fill="#3a78b8"></path>
            </marker>
          </defs>

          <!-- 상대 -->
          <g fill="#ffffff" stroke="#c3cedb" stroke-width="2.5">
            <circle cx="415" cy="233" r="20"></circle>
            <circle cx="45"  cy="233" r="20"></circle>
            <circle cx="45"  cy="57"  r="20"></circle>
            <circle cx="415" cy="57"  r="20"></circle>
          </g>

          <!-- 나 -> 상대 : 네 갈래 모두 같은 굵기·같은 색 -->
          <g stroke="#3a78b8" stroke-width="3" opacity=".9" marker-end="url(#ahB)">
            <line x1="284.2" y1="170.8" x2="389.7" y2="221.0"></line>
            <line x1="175.8" y1="170.8" x2="70.3"  y2="221.0"></line>
            <line x1="175.8" y1="119.2" x2="70.3"  y2="69.0"></line>
            <line x1="284.2" y1="119.2" x2="389.7" y2="69.0"></line>
          </g>

          <!-- 패킷 : 넷 다 같은 색·같은 크기 = 같은 내용 -->
          <g fill="#3a78b8">
            <rect x="-15" y="-11" width="30" height="22" rx="6" transform="translate(336.5,195.7) rotate(25.4)"></rect>
            <rect x="-15" y="-11" width="30" height="22" rx="6" transform="translate(123.5,195.7) rotate(154.6)"></rect>
            <rect x="-15" y="-11" width="30" height="22" rx="6" transform="translate(123.5,94.3) rotate(205.4)"></rect>
            <rect x="-15" y="-11" width="30" height="22" rx="6" transform="translate(336.5,94.3) rotate(-25.4)"></rect>
          </g>

          <!-- 나 -->
          <circle cx="230" cy="145" r="48" fill="#3a78b8"></circle>
          <text x="230" y="145" text-anchor="middle" dominant-baseline="central"
                font-family="Pretendard" font-size="31" font-weight="800" fill="#ffffff">나</text>
        </svg>
        <div class="say">보내는 내용이 <em>전부 같다</em>
          <span class="q">누구에게 보내든 "내 정보" 하나</span>
        </div>
      </div>

      <!-- INBOUND : 밖에서 나에게 모인다 -->
      <div class="panel in">
        <div class="ph"><span class="tag">인바운드</span><span class="dir">상대 N명 → <b>나</b></span></div>
        <svg class="viz" viewBox="0 25 460 240">
          <defs>
            <marker id="ahR" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13"
                    refX="11" refY="6.5" orient="auto">
              <path d="M0,0 L13,6.5 L0,13 Z" fill="#8d94a3"></path>
            </marker>
          </defs>

          <g fill="#ffffff" stroke="#dfc3ca" stroke-width="2.5">
            <circle cx="415" cy="233" r="20"></circle>
            <circle cx="45"  cy="233" r="20"></circle>
            <circle cx="45"  cy="57"  r="20"></circle>
            <circle cx="415" cy="57"  r="20"></circle>
          </g>

          <!-- 상대 -> 나 : 굵기가 제각각 -->
          <g stroke="#8d94a3" opacity=".9" marker-end="url(#ahR)">
            <line x1="389.7" y1="221.0" x2="286.9" y2="172.1" stroke-width="3.6"></line>
            <line x1="70.3"  y1="221.0" x2="173.1" y2="172.1" stroke-width="2.2"></line>
            <line x1="70.3"  y1="69.0"  x2="173.1" y2="117.9" stroke-width="4"></line>
            <line x1="389.7" y1="69.0"  x2="286.9" y2="117.9" stroke-width="2.7"></line>
          </g>

          <!-- 패킷 : 색·크기가 제각각 = 제각각인 내용 -->
          <g>
            <rect x="-16" y="-12" width="32" height="24" rx="6" fill="#d7263d" transform="translate(347.4,200.8) rotate(25.4)"></rect>
            <rect x="-12" y="-9"  width="24" height="18" rx="5" fill="#94a3b8" transform="translate(112.6,200.8) rotate(154.6)"></rect>
            <rect x="-17" y="-13" width="34" height="26" rx="7" fill="#566072" transform="translate(112.6,89.2) rotate(205.4)"></rect>
            <rect x="-13" y="-10" width="26" height="20" rx="5" fill="#b3122a" transform="translate(347.4,89.2) rotate(-25.4)"></rect>
          </g>

          <circle cx="230" cy="145" r="48" fill="#d7263d"></circle>
          <text x="230" y="145" text-anchor="middle" dominant-baseline="central"
                font-family="Pretendard" font-size="31" font-weight="800" fill="#ffffff">나</text>
        </svg>
        <div class="say">받는 내용이 <em>전부 다르다</em>
          <span class="q">상대 한 명 한 명이 서로 다른 정보</span>
        </div>
      </div>

    </div>

    <div class="foot">같은 내용은 <b>한 번만 만들면 되고</b>(P1), 다른 내용은 <b>한 봉투에 담으면 된다</b>(P2) — 그래서 처리도 둘로 나뉜다</div>
  </div>
</body>
</html>
