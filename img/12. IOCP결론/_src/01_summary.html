<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  @font-face{font-family:'Pretendard';src:url('fonts/PretendardVariable.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:block}
  :root{--bg:#eef1f5;--card:#ffffff;--ink:#1f2330;--muted:#7c8597;--red:#d7263d;--deep:#b3122a;--slate:#566072;--tile:#f6f8fb;--track:#e7ebf1;
        --green:#1f9d6b;--blue:#3a78b8;--orange:#e08b2a;--greent:#e7f6ef;--bluet:#e7f0fa;--oranget:#fbf1e2}
  *{box-sizing:border-box}
  html,body{margin:0;width:1200px;height:700px;overflow:hidden;background:var(--bg);font-family:'Pretendard',"Malgun Gothic","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;text-rendering:optimizeLegibility}
  .card{position:absolute;top:24px;left:24px;width:1152px;height:652px;background:var(--card);border:1px solid #eef0f3;border-radius:34px;box-shadow:0 1px 3px rgba(30,40,70,.05),0 14px 44px rgba(30,40,70,.075);padding:46px 60px 0}
  .title{font-size:44px;font-weight:800;color:var(--ink);letter-spacing:-1px;line-height:1.1}
  .title .r{color:var(--red)}
  .uline{width:78px;height:6px;border-radius:3px;background:var(--red);margin-top:18px}
  .sub{margin-top:18px;font-size:21px;font-weight:500;color:var(--muted);letter-spacing:-.2px;line-height:1.45}
  .sub b{color:#3a4254;font-weight:700}

  .hero{margin-top:36px;display:grid;grid-template-columns:1fr 430px;column-gap:34px;align-items:center}
  .anchor{background:var(--tile);border-radius:26px;padding:34px 40px 32px;position:relative;overflow:hidden}
  .anchor:before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;background:var(--red)}
  .alab{font-size:20px;font-weight:700;color:var(--slate);letter-spacing:-.2px}
  .abig{margin-top:10px;font-size:84px;font-weight:800;color:var(--red);letter-spacing:-3px;line-height:.98;display:flex;align-items:baseline}
  .abig .ap{font-size:52px;color:var(--deep);margin-right:6px}
  .abig .u{font-size:32px;font-weight:800;color:var(--slate);letter-spacing:-.5px;margin-left:12px}
  .acap{margin-top:18px;font-size:19px;font-weight:600;color:var(--muted);letter-spacing:-.2px;line-height:1.4}
  .acap b{color:#6b7484;font-weight:700}

  .chips{display:flex;flex-direction:column;gap:20px}
  .chip{background:var(--tile);border-radius:22px;padding:24px 26px;position:relative;overflow:hidden}
  .chip:before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px}
  .chip.r:before{background:var(--red)} .chip.b:before{background:var(--blue)}
  .chip.b{background:var(--bluet)}
  .ctag{font-size:17px;font-weight:800;letter-spacing:.2px;border-radius:9px;padding:6px 14px;display:inline-block}
  .chip.r .ctag{color:#fff;background:var(--red)} .chip.b .ctag{color:#fff;background:var(--blue)}
  .ctxt{margin-top:14px;font-size:21px;font-weight:700;color:var(--ink);letter-spacing:-.3px;line-height:1.38}
  .chip.r .ctxt b{color:var(--deep);font-weight:800} .chip.b .ctxt b{color:var(--blue);font-weight:800}

  .foot{position:absolute;left:60px;right:60px;bottom:24px;padding-top:18px;border-top:1px solid #eef0f3;font-size:18px;color:#9aa3b2;font-weight:500;letter-spacing:-.2px}
  .foot b{color:#6b7484;font-weight:700}
</style>
</head>
<body>
  <div class="card">
    <div class="title">단일 게임 스레드 실측 <span class="r">~5000</span></div>
    <div class="uline"></div>
    <div class="sub">"맵당 5000"은 맵=게임 스레드 <b>샤딩 전제</b>의 설계 목표. 지금은 게임 스레드 <b>1개(전 맵 공유)</b>라 5000은 <b>서버 총량</b></div>

    <div class="hero">
      <div class="anchor">
        <div class="alab">동접 · 단일 게임 스레드</div>
        <div class="abig"><span class="ap">~</span>5000<span class="u">명</span></div>
        <div class="acap">천장 <b>~5200</b> · <b>5400</b> 붕괴 · 여유 기준 <b>4500–4800</b></div>
      </div>
      <div class="chips">
        <div class="chip r">
          <span class="ctag">실측</span>
          <div class="ctxt">단일 맵·loopback = <b>~5000</b></div>
        </div>
        <div class="chip b">
          <span class="ctag">설계</span>
          <div class="ctxt">맵=게임스레드 샤딩 → <b>맵당 5000</b></div>
        </div>
      </div>
    </div>

    <div class="foot">i9-10900(서버 6 물리코어) · 단일 맵·단일 게임 스레드 · <b>40ms 틱</b> · loopback·봇 부하</div>
  </div>
</body>
</html>
